name: Web uygulamasını yayınla (GitHub Pages)

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "apk/**"
      - "tools/**"
      - "**.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages ayarları
        uses: actions/configure-pages@v5

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js pdf icons _site/
          echo "Sınav Kampı yayında" > _site/README.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
