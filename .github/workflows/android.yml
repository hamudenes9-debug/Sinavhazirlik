name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['app/**', 'web/**', 'scripts/**', '*.gradle', 'gradle/**', 'gradlew', 'package*.json', 'src/**', 'tests/**', 'firestore.rules', 'firebase.json', '.firebaserc', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  firebase-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Test Firestore isolation and validation
        id: rules
        run: set -o pipefail; npm run test:rules 2>&1 | tee firestore-test.log
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test real Firebase SDK against local emulators
        id: cloud
        run: set -o pipefail; PLAYWRIGHT_CHROMIUM=system npm run test:cloud 2>&1 | tee cloud-test.log
      - name: Test offline application and mobile layout
        id: browser
        run: set -o pipefail; timeout 120s env PLAYWRIGHT_CHROMIUM=system npm run test:browser 2>&1 | tee browser-test.log
      - name: Report test failure
        if: failure()
        run: |
          for f in browser-test.log cloud-test.log firestore-test.log; do
            if [ -f "$f" ]; then
              echo "::error title=$f::$(tail -c 1800 "$f" | tr '\n' ' ')"
            fi
          done
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-diagnostics
          path: |
            firestore-test.log
            cloud-test.log
            browser-test.log
            firebase-debug.log
            firestore-debug.log
            auth-debug.log
            test-results/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p artifacts && cp app/build/outputs/apk/debug/app-debug.apk artifacts/Sinav-Kampi.apk
      - name: Verify stable signing key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs artifacts/Sinav-Kampi.apk
      - uses: actions/upload-artifact@v4
        with: {name: Sinav-Kampi-APK, path: artifacts/Sinav-Kampi.apk, if-no-files-found: error}
  release:
    needs: [build, firebase-rules]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Sinav-Kampi-APK, path: artifacts}
      - name: Verify and publish the installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s artifacts/Sinav-Kampi.apk
          unzip -t artifacts/Sinav-Kampi.apk
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/(firebase.js|cloud-ui.js|index.html)'
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/voice/(intro|who|saved)\.mp3'
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/(voice/ring\.wav|kb\.js)'
          sha256sum artifacts/Sinav-Kampi.apk | tee apk-sha256.txt
          if gh release view v1.11.0 >/dev/null 2>&1; then
            gh release upload v1.11.0 artifacts/Sinav-Kampi.apk apk-sha256.txt --clobber
          else
            gh release create v1.11.0 artifacts/Sinav-Kampi.apk apk-sha256.txt --target "$GITHUB_SHA" --title "Sınav Kampı v1.11.0 — OpenRouter çevrimiçi beyin" --notes "Koç artık iki katmanlı çalışıyor: önce cihazdaki 154 maddelik bilgi bankası ve 126 PDF not parçası, yetmezse OpenRouter üzerindeki yapay zekâ. Ayarlar > Koç sayfasından anahtar ve model değiştirilebilir, 'Bağlantıyı dene' ile test edilir, 'Çevrimiçi beyin' kapatılınca her şey cihazda kalır. Ses kaydı uygulamadan çıkmaz. Ayrıntılar: AI-KOC.md."
          fi
