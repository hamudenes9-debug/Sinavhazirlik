name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['app/**', 'web/**', 'scripts/**', '*.gradle', 'gradle/**', 'gradlew', 'package*.json', 'src/**', 'tests/**', 'firestore.rules', 'firebase.json', '.firebaserc', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  firebase-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Test Firestore isolation and validation
        id: rules
        continue-on-error: true
        run: set -o pipefail; npm run test:rules 2>&1 | tee firestore-test.log
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test real Firebase SDK against local emulators
        id: cloud
        continue-on-error: true
        run: set -o pipefail; PLAYWRIGHT_CHROMIUM=system npm run test:cloud 2>&1 | tee cloud-test.log
      - name: Test offline application and mobile layout
        id: browser
        run: PLAYWRIGHT_CHROMIUM=system npm run test:browser
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-diagnostics
          path: |
            firestore-test.log
            cloud-test.log
            firebase-debug.log
            firestore-debug.log
            auth-debug.log
            test-results/
          if-no-files-found: ignore
      - name: Enforce Firebase and browser test results
        if: steps.rules.outcome == 'failure' || steps.cloud.outcome == 'failure'
        run: exit 1
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p artifacts && cp app/build/outputs/apk/debug/app-debug.apk artifacts/Sinav-Kampi.apk
      - uses: actions/upload-artifact@v4
        with: {name: Sinav-Kampi-APK, path: artifacts/Sinav-Kampi.apk, if-no-files-found: error}
