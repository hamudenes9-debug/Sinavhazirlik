name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['app/**', 'web/**', 'scripts/**', '*.gradle', 'gradle/**', 'gradlew', 'package*.json', 'src/**', 'tests/**', 'firestore.rules', 'firebase.json', '.firebaserc', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  firebase-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Test Firestore isolation and validation
        id: rules
        run: set -o pipefail; npm run test:rules 2>&1 | tee firestore-test.log
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test real Firebase SDK against local emulators
        id: cloud
        run: set -o pipefail; PLAYWRIGHT_CHROMIUM=system npm run test:cloud 2>&1 | tee cloud-test.log
      - name: Test offline application and mobile layout
        id: browser
        run: set -o pipefail; timeout 120s env PLAYWRIGHT_CHROMIUM=system npm run test:browser 2>&1 | tee browser-test.log
      - name: Report test failure
        if: failure()
        run: |
          for f in browser-test.log cloud-test.log firestore-test.log; do
            if [ -f "$f" ]; then
              echo "::error title=$f::$(tail -c 1800 "$f" | tr '\n' ' ')"
            fi
          done
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-diagnostics
          path: |
            firestore-test.log
            cloud-test.log
            browser-test.log
            firebase-debug.log
            firestore-debug.log
            auth-debug.log
            test-results/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Taslak "ai-config" sürümünü okuyup anahtarı derlemeye gömmek için gerekli.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - uses: gradle/actions/setup-gradle@v4
      - name: Read the coach configuration
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECRET_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -u
          key="$SECRET_KEY"
          model="$SECRET_MODEL"
          if [ -z "$key" ]; then
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "ai-config") | .body' 2>/dev/null | head -c 4000 || true)
            key=$(printf '%s' "$body" | grep -o 'sk-or-v1-[A-Za-z0-9]\{32,120\}' | head -n 1 || true)
            model=$(printf '%s' "$body" | sed -n 's/^OPENROUTER_MODEL=//p' | head -n 1 || true)
          fi
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            { echo "OPENROUTER_API_KEY=$key"; } >> "$GITHUB_ENV"
            echo "ai-config: anahtar hazır (${key:0:8}...${key: -4})"
          else
            echo "::warning::OpenRouter anahtarı bulunamadı; koç yalnızca cihazda çalışacak"
          fi
          if [ -n "$model" ]; then echo "OPENROUTER_MODEL=$model" >> "$GITHUB_ENV"; fi
      - run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Confirm the coach key is bundled
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            grep -q 'sk-or-v1-' app/src/main/assets/www/ai-config.js
            echo "ai-config: anahtar APK varlıklarına gömüldü"
          else
            echo "::warning::anahtar gömülmedi; koç yalnızca cihazda çalışır"
          fi
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p artifacts && cp app/build/outputs/apk/debug/app-debug.apk artifacts/Sinav-Kampi.apk
      - name: Verify stable signing key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs artifacts/Sinav-Kampi.apk
      - uses: actions/upload-artifact@v4
        with: {name: Sinav-Kampi-APK, path: artifacts/Sinav-Kampi.apk, if-no-files-found: error}
  release:
    needs: [build, firebase-rules]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Sinav-Kampi-APK, path: artifacts}
      - name: Verify and publish the installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s artifacts/Sinav-Kampi.apk
          unzip -t artifacts/Sinav-Kampi.apk
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/(firebase.js|cloud-ui.js|index.html)'
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/voice/(intro|who|saved)\.mp3'
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/(voice/ring\.wav|kb\.js)'
          unzip -l artifacts/Sinav-Kampi.apk | grep -E 'assets/www/(game\.js|words\.js|theme\.js|update\.js|version\.js)'
          unzip -p artifacts/Sinav-Kampi.apk assets/www/ai-config.js | grep -q 'sk-or-v1-' && echo "ai-config: APK içinde çevrimiçi beyin anahtarı var" || echo "::warning::APK içinde anahtar yok"
          sha256sum artifacts/Sinav-Kampi.apk | tee apk-sha256.txt
          NOTES=$(cat <<'EOF'
          **Otomatik güncelleme:** Uygulama her açılışta GitHub'daki en son sürümü kontrol eder. Yeni sürüm varsa üstte "Güncelle" şeridi çıkar; indirme ve kurulum Android'in onayıyla yapılır.

          **Kelime Oyunu geldi:** Her turda 10 soru. Karışık, anlamı bul, kelimeyi bul ve eş anlamlı modları; seri bonusu, puan ve rekor takibi. Tümü çevrimdışı çalışır.

          **Renk teması:** Kamp, Okyanus, Gün batımı, Lavanta ve Gece (koyu) temaları. Ayarlar > Renk teması ya da üst çubuktaki ay düğmesi.

          **Arayüz tazelemesi:** Daha yumuşak kartlar, canlı vurgular, hızlı geçişler; ana sayfada "Kelime Oyunu geldi" duyurusu ve tek dokunuşla oyuna giriş.

          Ayarlar > Sürüm ve güncellemeler bölümünden elle kontrol de edebilirsin. Güncelleme yalnızca APK'yı indirir; çalışma kaydın cihazda kalır.
          EOF
          )
          if gh release view v1.12.0 >/dev/null 2>&1; then
            gh release upload v1.12.0 artifacts/Sinav-Kampi.apk apk-sha256.txt --clobber
            gh release edit v1.12.0 --notes "$NOTES"
          else
            gh release create v1.12.0 artifacts/Sinav-Kampi.apk apk-sha256.txt --target "$GITHUB_SHA" --title "Sınav Kampı v1.12.0 — Kelime Oyunu, temalar ve otomatik güncelleme" --notes "$NOTES"
          fi
