name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['app/**', 'web/**', 'scripts/**', '*.gradle', 'gradle/**', 'gradlew', 'package*.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes:20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p artifacts && cp app/build/outputs/apk/debug/app-debug.apk artifacts/Sinav-Kampi.apk
      - uses: actions/upload-artifact@v4
        with: {name: Sinav-Kampi-APK, path: artifacts/Sinav-Kampi.apk, if-no-files-found: error}
