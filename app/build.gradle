plugins { id 'com.android.application' }
android {
    namespace 'tr.com.sinavkampi'
    compileSdk 35
    defaultConfig {
        applicationId 'Com.company.sinavhazirlik'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.8.2'
    }
    signingConfigs {
        /* Sabit imza: yeni APK eskisinin üzerine kurulabilsin (CI'da üretilen rastgele debug anahtarı yerine). */
        stable {
            storeFile file('../keystore/sinav-kampi.p12')
            storeType 'PKCS12'
            storePassword 'sinavkampi'
            keyAlias 'sinavkampi'
            keyPassword 'sinavkampi'
        }
    }
    buildTypes {
        debug { applicationIdSuffix ''; versionNameSuffix ''; signingConfig signingConfigs.stable }
        release { minifyEnabled false; signingConfig signingConfigs.stable }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'mp3', 'wav' }
}
dependencies { implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1' }
